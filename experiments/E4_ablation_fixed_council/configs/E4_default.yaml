# E4 — Leave-one-module-out ablation on the fixed 4-agent council.
#
# Reruns v1's A5 ablation on the DataAgent-fixed pipeline (see Phase 1.3).
# Five variants × 3 seeds = 15 runs at reduced budget (5 rounds × 50 iter
# per round) → ~10 minutes total.
#
# Consumed by src/v2/runners/E4_ablation.py.

# ----- E4-specific -----
target: cauchy_A
data_csv: data/extended/tier2_binary.csv
n_seeds: 3
n_rounds: 5          # per-variant PySR rounds (reduced from E1's 10)
niterations: 50      # per-round PySR iterations (reduced from E1's 100)

# ----- standard harness keys -----
project:
  name: "HARNESS-2D-RI"
  version: "2.0.0-E4"
  description: "E4: LOO ablation on fixed 4-agent council"

data:
  source: "csv"
  validation_source: null
  features:
    structural:
      - atomic_number_M
      - atomic_number_X
      - electronegativity_M
      - electronegativity_X
      - atomic_radius_M
      - atomic_radius_X
      - ionization_energy_M
      - electron_affinity_X
      - d_electron_count
      - bond_length_MX
      - lattice_constant_a
      - monolayer_thickness
      - coordination_number
      - point_group_encoded
    derived:
      - electronegativity_diff
      - radius_ratio
      - bond_polarity
      - packing_fraction
  targets:
    - cauchy_A

constraints:
  dimensional_analysis:
    enabled: true
    target_dimension: "dimensionless"
  cauchy_model:
    enabled: true
    form: "n = A + B/lambda^2"
    lambda_range_nm: [755, 1064]
    n_must_be_positive: true
    dn_dlambda_negative: true
  symmetry:
    enabled: true
    check_point_group_invariance: true
  simplicity:
    max_tree_depth: 6
    max_operators: 8
    parsimony_weight: 0.05
    prefer_known_forms: true

llm_sr:
  method: "langlaw_llmsr_hybrid"
  llm:
    provider: "anthropic"
    model: "claude-sonnet-4-20250514"
    temperature: 0.7
    max_tokens: 4096
  pysr:
    populations: 40
    population_size: 33
    niterations: 50        # will be overridden per runner logic
    binary_operators: ["+", "-", "*", "/"]
    unary_operators: ["exp", "log", "sqrt", "square", "inv"]
    maxsize: 25
    parsimony: 0.05
    nested_constraints:
      exp: {exp: 0, log: 0}
      log: {exp: 0, log: 0}
      sqrt: {sqrt: 0}
  search:
    max_rounds: 5
    max_formulas_per_round: 200
    convergence_threshold: 0.01
    experience_pool_size: 50

agents:
  data_agent:
    role: "Analyze feature correlations and suggest variable subsets"
  theory_agent:
    role: "Generate physics-informed hypotheses for structure-RI relations"
  validator_agent:
    role: "Validate discovered formulas against physics and held-out data"
  meta_agent:
    role: "Orchestrate agent collaboration and resolve conflicts"
    max_debate_rounds: 3

output:
  save_dir: "experiments/E4_ablation_fixed_council/runs/latest/"
  save_pareto_front: true
  save_experience_pool: true
  export_latex: false
  visualization: false

adaptive_search:
  operator_failure_threshold: 3
  min_operator_trials: 2
  depth_reduction_on_timeout: 1
  power_law_detection_threshold: 0.5

deliberation:
  max_debate_rounds: 3
  veto_requires_evidence: true
  physics_tiebreak: "validator_agent"
  feature_veto_variance_threshold: 0.01
  feature_veto_mi_threshold: 0.005

knowledge_memory:
  persistence_path: "experiments/E4_ablation_fixed_council/runs/latest/knowledge_memory.json"
  min_evidence_for_rule: 2
  exclusion_confidence_threshold: 0.6
  max_exclusion_rules: 20
  max_success_patterns: 10
