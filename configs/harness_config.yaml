# Harness Engineering Configuration for 2D Material RI Discovery
# ================================================================

project:
  name: "HARNESS-2D-RI"
  version: "1.0.0"
  description: "Harness Engineering framework for discovering structure-RI equations in 2D TMD materials"

# Layer 1: Data Configuration
data:
  source: "c2db_tmd"            # Primary: C2DB TMD subset
  validation_source: "alexandria" # External validation: Alexandria DB
  features:
    structural:
      - atomic_number_M          # Transition metal atomic number
      - atomic_number_X          # Chalcogen atomic number
      - electronegativity_M      # Metal electronegativity (Pauling)
      - electronegativity_X      # Chalcogen electronegativity
      - atomic_radius_M          # Metal atomic radius (Å)
      - atomic_radius_X          # Chalcogen atomic radius (Å)
      - ionization_energy_M      # Metal first ionization energy (eV)
      - electron_affinity_X      # Chalcogen electron affinity (eV)
      - d_electron_count         # Metal d-electron count
      - bond_length_MX           # M-X bond length (Å)
      - lattice_constant_a       # In-plane lattice constant (Å)
      - monolayer_thickness      # Corrected monolayer thickness (Å)
      - coordination_number      # Coordination number of M
      - point_group_encoded      # Point group (numerical encoding)
    derived:
      - electronegativity_diff   # |χ_M - χ_X|
      - radius_ratio             # r_M / r_X
      - bond_polarity            # (χ_X - χ_M) / (χ_X + χ_M)
      - packing_fraction         # Estimated packing fraction
  targets:
    - cauchy_A                   # Cauchy coefficient A (n at λ→∞)
    - cauchy_B                   # Cauchy coefficient B (dispersion)
    - n_at_1064nm                # Refractive index at 1064 nm
    - n_at_785nm                 # Refractive index at 785 nm

# Layer 2: Physical Constraints
constraints:
  dimensional_analysis:
    enabled: true
    target_dimension: "dimensionless"  # Refractive index is dimensionless
  cauchy_model:
    enabled: true
    form: "n = A + B/lambda^2"   # Enforced dispersion form
    lambda_range_nm: [755, 1064] # Near-IR window
    n_must_be_positive: true
    dn_dlambda_negative: true    # Normal dispersion: n decreases with λ
  symmetry:
    enabled: true
    check_point_group_invariance: true
  simplicity:
    max_tree_depth: 6
    max_operators: 8
    parsimony_weight: 0.05       # Penalty for complexity in PySR
    prefer_known_forms: true     # Prefer forms like power laws, ratios

# Layer 3: LLM-SR Engine Configuration
llm_sr:
  method: "langlaw_llmsr_hybrid"
  llm:
    provider: "anthropic"
    model: "claude-sonnet-4-20250514"
    temperature: 0.7
    max_tokens: 4096
  pysr:
    populations: 40
    population_size: 33
    niterations: 100
    binary_operators: ["+", "-", "*", "/"]
    unary_operators: ["exp", "log", "sqrt", "square", "inv"]
    maxsize: 25
    parsimony: 0.05
    nested_constraints:
      exp: {exp: 0, log: 0}
      log: {exp: 0, log: 0}
      sqrt: {sqrt: 0}
  search:
    max_rounds: 15               # Max LLM-guided iterations
    max_formulas_per_round: 200
    convergence_threshold: 0.01  # RMSE improvement threshold
    experience_pool_size: 50     # Top formulas retained

# Layer 4: Multi-Agent Configuration
agents:
  data_agent:
    role: "Analyze feature correlations and suggest variable subsets"
    tools: ["correlation_analysis", "mutual_information", "pca"]
  theory_agent:
    role: "Generate physics-informed hypotheses for structure-RI relations"
    tools: ["hypothesis_generation", "dimensional_analysis", "literature_search"]
  validator_agent:
    role: "Validate discovered formulas against physics and held-out data"
    tools: ["cauchy_check", "ood_test", "dimensional_verify", "stability_test"]
  meta_agent:
    role: "Orchestrate agent collaboration and resolve conflicts"
    max_debate_rounds: 3

# Layer 5: Output Configuration
output:
  save_dir: "results/"
  save_pareto_front: true
  save_experience_pool: true
  export_latex: true
  visualization: true

# Genuine Harness Engineering Extensions
# ----------------------------------------

# Adaptive Search Environment (Gap 4)
adaptive_search:
  operator_failure_threshold: 3      # Remove operator after N consecutive failed rounds
  min_operator_trials: 2             # Don't remove until at least this many trials
  depth_reduction_on_timeout: 1      # Reduce max_depth by this if round produces 0 candidates
  power_law_detection_threshold: 0.5 # Fraction of Pareto front with power-law form → add fractional powers

# Agent Deliberation (Gap 3)
deliberation:
  max_debate_rounds: 3
  veto_requires_evidence: true       # Veto must include data reference, not assertion alone
  physics_tiebreak: "validator_agent"
  feature_veto_variance_threshold: 0.01  # VETO feature if variance < this
  feature_veto_mi_threshold: 0.005       # VETO feature if mutual info < this

# Structured Knowledge Memory (Gap 5)
knowledge_memory:
  persistence_path: "results/knowledge_memory.json"
  min_evidence_for_rule: 2           # Rounds of evidence needed to confirm exclusion rule
  exclusion_confidence_threshold: 0.6
  max_exclusion_rules: 20
  max_success_patterns: 10
